<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10101c">
<meta name="description" content="Pentropy Play: a no-money gaming platform that shows you, in real time, how casino-style games take your money. Free anti-gambling tokens, zero value, full transparency.">
<meta name="referrer" content="no-referrer">
<title>Pentropy Play</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<svg width="0" height="0" class="defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="volume" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="solid"><feFuncA type="linear" slope="100"/></feComponentTransfer>
      <feMorphology in="solid" operator="dilate" radius="0.8" result="grown"/>
      <feFlood flood-color="#10101c" flood-opacity="0.4"/>
      <feComposite in2="grown" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M17 23a1 1 0 0 1-.7-.3l-10-10a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 1.4L8.4 12l9.3 9.3A1 1 0 0 1 17 23z"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M7 23a1 1 0 0 1-.7-1.7L15.6 12 6.3 2.7A1 1 0 0 1 7.7 1.3l10 10a1 1 0 0 1 0 1.4l-10 10A1 1 0 0 1 7 23z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 19.4 2.6 13l1.8-1.8L9 15.8 19.6 5.2l1.8 1.8z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9zm-8-2a3 3 0 0 1 6 0v2H9z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/></symbol>
  </defs>
</svg>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app" aria-live="polite">
  <noscript><p class="lead">Pentropy Play needs JavaScript to run.</p></noscript>
</main>
<footer class="wrap foot" id="footer"></footer>
<script type="module" src="/js/app.js"></script>
</body>
</html>
